<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Country Gallery - Dynamic</title>
    <link rel="stylesheet" href="../css/main.css">
    <style>
        .loading {
            text-align: center;
            padding: 20px;
            font-size: 18px;
            color: #666;
        }
        
        .error {
            text-align: center;
            padding: 20px;
            color: #d32f2f;
            background: #ffebee;
            border-radius: 8px;
            margin: 20px;
        }
        
        .photo-info {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            background: rgba(0, 0, 0, 0.7);
            color: white;
            padding: 10px;
            font-size: 14px;
            opacity: 0;
            transition: opacity 0.3s ease;
        }
        
        .gallery-item:hover .photo-info {
            opacity: 1;
        }
        
        .photo-date {
            font-size: 12px;
            color: #ccc;
            margin-top: 5px;
        }
        
        .upload-status {
            position: fixed;
            top: 20px;
            right: 20px;
            background: #4caf50;
            color: white;
            padding: 10px 20px;
            border-radius: 5px;
            display: none;
            z-index: 1000;
        }
    </style>
</head>
<body>
    <nav>
        <ul>
            <li><a href="/">About</a></li>
            <li><a href="https://drive.google.com/file/d/1-3B6uI3OSzv_0v_uPBvD3A0phSxpmT4q/view?usp=sharing">CV</a></li>
            <li><a href="travel.html">Travel Archive</a></li>
            <li><a href="crochet.html">Crochet Projects</a></li>
        </ul>
    </nav>

    <h2>Gallery for <span id="country-name">Loading...</span></h2>
    
    <div id="upload-status" class="upload-status">
        New photos uploaded! Refreshing gallery...
    </div>

    <div id="gallery"></div>
    <div id="loading" class="loading">Loading photos...</div>

    <script>
        // Configuration - Update this URL to your Google Drive JSON file
        const PHOTO_DATA_URL = "travel-photos-data.json";
        
        let photoData = null;
        let currentCountry = null;

        document.addEventListener("DOMContentLoaded", function() {
            // Get country from URL
            const urlParams = new URLSearchParams(window.location.search);
            currentCountry = urlParams.get('country');
            
            if (!currentCountry) {
                showError("No country specified");
                return;
            }
            
            document.getElementById('country-name').textContent = currentCountry;
            
            // Load photo data
            loadPhotoData();
        });

        async function loadPhotoData() {
            try {
                const response = await fetch(PHOTO_DATA_URL);
                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }
                
                photoData = await response.json();
                displayPhotos();
                
            } catch (error) {
                console.error("Error loading photo data:", error);
                showError("Failed to load photos. Please try again later.");
            }
        }

        function displayPhotos() {
            const galleryContainer = document.getElementById('gallery');
            const loadingElement = document.getElementById('loading');
            
            loadingElement.style.display = 'none';
            
            if (!photoData || !photoData[currentCountry]) {
                galleryContainer.innerHTML = `
                    <div class="error">
                        <p>No photos available for ${currentCountry} yet.</p>
                        <p>Upload photos to the "${currentCountry}" folder in Google Drive to see them here!</p>
                    </div>
                `;
                return;
            }
            
            const countryPhotos = photoData[currentCountry];
            galleryContainer.innerHTML = '';
            
            countryPhotos.forEach(photo => {
                const photoElement = createPhotoElement(photo);
                galleryContainer.appendChild(photoElement);
            });
        }

        function createPhotoElement(photo) {
            const div = document.createElement('div');
            div.className = 'gallery-item';
            
            const img = document.createElement('img');
            img.src = photo.thumbnailUrl || photo.url;
            img.alt = photo.caption || photo.name;
            img.loading = 'lazy'; // Enable lazy loading
            
            // Add error handling for images
            img.onerror = function() {
                this.src = 'data:image/svg+xml;base64,PHN2ZyB3aWR0aD0iNDAwIiBoZWlnaHQ9IjMwMCIgeG1sbnM9Imh0dHA6Ly93d3cudzMub3JnLzIwMDAvc3ZnIj48cmVjdCB3aWR0aD0iMTAwJSIgaGVpZ2h0PSIxMDAlIiBmaWxsPSIjZjVmNWY1Ii8+PHRleHQgeD0iNTAlIiB5PSI1MCUiIGZvbnQtZmFtaWx5PSJBcmlhbCwgc2Fucy1zZXJpZiIgZm9udC1zaXplPSIxNCIgZmlsbD0iIzk5OSIgdGV4dC1hbmNob3I9Im1pZGRsZSIgZHk9Ii4zZW0iPkltYWdlIG5vdCBhdmFpbGFibGU8L3RleHQ+PC9zdmc+';
            };
            
            const photoInfo = document.createElement('div');
            photoInfo.className = 'photo-info';
            
            const caption = document.createElement('div');
            caption.textContent = photo.caption || photo.name;
            
            const date = document.createElement('div');
            date.className = 'photo-date';
            const uploadDate = new Date(photo.uploadDate);
            date.textContent = `Uploaded: ${uploadDate.toLocaleDateString()}`;
            
            photoInfo.appendChild(caption);
            photoInfo.appendChild(date);
            
            div.appendChild(img);
            div.appendChild(photoInfo);
            
            // Add click handler to open full image
            div.addEventListener('click', () => {
                window.open(photo.url, '_blank');
            });
            
            return div;
        }

        function showError(message) {
            const galleryContainer = document.getElementById('gallery');
            const loadingElement = document.getElementById('loading');
            
            loadingElement.style.display = 'none';
            galleryContainer.innerHTML = `<div class="error">${message}</div>`;
        }

    </script>
</body>
</html>
